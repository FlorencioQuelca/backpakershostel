const left=(it,s)=>it.cap-((S.booked[it.id]||{})[s]||0);
const leftR=(it,a,b)=>{let m=it.cap;for(let s=a;s<b;s=addD(s,1))m=Math.min(m,left(it,s));return Math.max(0,m)};
const dayFull=s=>S.items.every(it=>left(it,s)<=0);
const t=k=>T[lang()][k];

function cal(){
 const v=S.view,loc=lang();let h='';
 for(let k=0;k<2;k++){
  const f=new Date(Date.UTC(v.y,v.m+k,1)),n=new Date(Date.UTC(v.y,v.m+k+1,0)).getUTCDate(),off=(f.getUTCDay()+6)%7;
  h+=`<div><div class="mh">${k?'<span></span>':'<button type="button" data-nav="-1" aria-label="‹">‹</button>'}<span>${new Intl.DateTimeFormat(loc,{month:'long',year:'numeric',timeZone:'UTC'}).format(f)}</span>${k?'<button type="button" data-nav="1" aria-label="›">›</button>':'<span></span>'}</div><div class="mg">`;
  for(let i=0;i<7;i++)h+=`<span class="wd">${new Intl.DateTimeFormat(loc,{weekday:'short',timeZone:'UTC'}).format(new Date(Date.UTC(2024,0,1+i)))}</span>`;
  h+='<span></span>'.repeat(off);
  for(let d=1;d<=n;d++){const s=ymd(new Date(Date.UTC(v.y,v.m+k,d)));
   const cls=(s===S.in||s===S.out)?'on':(S.in&&S.out&&s>S.in&&s<S.out)?'in':'';
   h+=`<button type="button" class="d ${cls}" data-d="${s}" ${(s<today||dayFull(s))&&s!==S.out?'disabled':''}>${d}</button>`}
  h+='</div></div>'}
 $('#cal').innerHTML=h;
 $('#rng').textContent=S.in&&S.out?`${S.in} → ${S.out} · ${diff(S.in,S.out)} ${t('nightsN')}`:'';
}
function rooms(){
 const ok=S.in&&S.out;$('#s2').hidden=!ok;if(!ok){$('#s3').hidden=true;return}
 const l=lang();let any=false;
 $('#items').innerHTML=S.items.map((it,i)=>{const a=leftR(it,S.in,S.out);if(a>0)any=true;const tr=it.tiers&&it.tiers.length?it.tiers:null;
  const q=tr?(a?(S.qty[it.id]||0):0):Math.min(S.qty[it.id]||0,a);S.qty[it.id]=q;
  const lb=`${t('room')} ${it.n}`,lo=tr?Math.min(...tr):0,hi=tr?Math.max(...tr):0;
  const price=tr?(lo===hi?money(lo,l):`${money(lo,l)} – ${money(hi,l)}`):money(it.price,l);
  const ctl=!a?`<input type="number" value="0" disabled aria-label="${lb}">`:tr?`<select data-id="${it.id}" data-tier="1" aria-label="${lb}"><option value="0">—</option>${tr.map((p,k)=>`<option value="${k+1}" ${q==k+1?'selected':''}>${k?(k+1)+' '+t('persons'):t('pax1')} · ${money(p,l)}</option>`).join('')}</select>`:`<input type="number" min="0" max="${a}" value="${q}" data-id="${it.id}" aria-label="${lb}">`;
  return `<div class="it ${a?'':'off'}" style="--c:var(${COL[i%4]})"><div><b>${lb} · ${t(it.type)}</b><small>${it.beds} ${t('beds')} · ${a?`${a} ${t('left')}`:t('full')}</small></div><div><b style="font:700 1.05rem var(--sans);color:var(--maroon)">${price}</b><small>${t(it.unit==='bed'?'perBed':'perRoom')}</small></div>${ctl}</div>`}).join('');
 $('#none').hidden=any;sum();
}
function sum(){
 const l=lang(),nn=diff(S.in,S.out);let tv=0,last=null,h='';
 S.items.forEach(it=>{const v=S.qty[it.id]||0;if(!v)return;const tr=it.tiers&&it.tiers.length?it.tiers:null,q=tr?1:v,u=tr?tr[Math.min(v,tr.length)-1]:it.price,a=cv(q*u*nn,l);tv+=a[0];last=a;
  const tag=tr?` · ${v>1?v+' '+t('persons'):t('pax1')}`:'';
  h+=`<div><span>${t('room')} ${it.n} · ${t(it.type)}${tag} × ${q} × ${nn} ${t('nightsN')}</span><span>${fmt(a)}</span></div>`});
 $('#sum').innerHTML=h+(last?`<div class="tt"><span>${t('total')}</span><span>${fmt([tv,last[1],last[2]])}</span></div>`:'')+(converted(l)?`<p class="hi" style="margin:8px 0 0">${convHTML(l)}</p>`:'');
 $('#s3').hidden=!last;
}
$('#cal').onclick=e=>{
 const nav=e.target.closest('[data-nav]');
 if(nav){const d=new Date(Date.UTC(S.view.y,S.view.m+(+nav.dataset.nav),1)),n=new Date();if(d>=new Date(Date.UTC(n.getUTCFullYear(),n.getUTCMonth(),1)))S.view={y:d.getUTCFullYear(),m:d.getUTCMonth()};return cal()}
 const b=e.target.closest('.d');if(!b)return;const s=b.dataset.d;
 if(!S.in||S.out||s<=S.in){S.in=s;S.out=null}else S.out=s;
 cal();rooms();
};
$('#items').oninput=e=>{const i=e.target;if(i.dataset.id){const v=+i.value||0;S.qty[i.dataset.id]=i.dataset.tier?v:Math.max(0,Math.min(+i.max,v));sum()}};

async function load(){
 if(!CFG.API)return;
 try{const d=await (await fetch(CFG.API+'?action=avail')).json();if(d.items&&d.items.length){S.items=d.items.map(i=>({...i,tiers:i.tiers?String(i.tiers).split('|').map(Number):null}));S.booked=d.booked||{}}}catch(e){}
}
function text(l){
 document.documentElement.lang=l;
 document.querySelectorAll('[data-t]').forEach(e=>e.textContent=T[l][e.dataset.t]);
 cal();rooms();
}
$('#lang').onchange=()=>{try{localStorage.setItem('lang',lang())}catch(e){};text(lang())};

function booking(){const f=new FormData($('#f')),sel=S.items.filter(i=>S.qty[i.id]),tr=i=>i.tiers&&i.tiers.length;
 const items=sel.map(i=>tr(i)?{id:i.id,qty:1,pax:S.qty[i.id]}:{id:i.id,qty:S.qty[i.id]});
 const desc=sel.map(i=>`${t('room')} ${i.n} (${t(i.type)}) x${tr(i)?1:S.qty[i.id]}${tr(i)?` [${S.qty[i.id]>1?S.qty[i.id]+' '+t('persons'):t('pax1')}]`:''}`).join(', ');
 const pay={name:f.get('name'),email:f.get('email'),phone:f.get('phone'),message:f.get('message'),checkin:S.in,checkout:S.out,guests:$('#g').value,items,lang:lang()};
 const m=`Hola Oruro Backpackers! ${pay.name} (${pay.email}, ${pay.phone})\n${S.in} → ${S.out}\n${desc}\n${t('guests')}: ${pay.guests}\n${pay.message||''}`;
 return {pay,desc,m,url:`https://wa.me/${CFG.wa}?text=${encodeURIComponent(m)}`}}
const stat=(c,h)=>{$('#ok').className='st '+c;$('#ok').innerHTML=h};
$('#wa').onclick=()=>{if($('#f').reportValidity())window.open(booking().url,'_blank')};
$('#f').onsubmit=async e=>{
 e.preventDefault();const b=e.target.querySelector('.go'),B=booking();b.disabled=true;stat('',t('sending'));
 try{
  const r=CFG.API?await fetch(CFG.API,{method:'POST',body:JSON.stringify(B.pay)}):await fetch('send.php',{method:'POST',body:new URLSearchParams({name:B.pay.name,email:B.pay.email,checkin:S.in,checkout:S.out,guests:B.pay.guests,room:B.desc,message:`${B.pay.phone} | ${B.pay.message||''}`})});
  if(!r.ok)throw 0;const d=await r.json();if(!d.ok)throw d.error||0;
  stat('ok',t('sentMail'));return;
 }catch(x){stat('err',`${t('mailErr')} <a href="${B.url}" target="_blank" rel="noopener">WhatsApp</a>`)}
 b.disabled=false;
};

(async()=>{
 let sv=null;try{sv=localStorage.getItem('lang')}catch(e){}
 const nv=(navigator.language||'es').slice(0,2);$('#lang').value=L.includes(sv)?sv:(L.includes(nv)?nv:'es');
 const q=new URLSearchParams(location.search);
 if(q.get('g'))$('#g').value=q.get('g');
 if(/^\d{4}-\d{2}-\d{2}$/.test(q.get('in')||'')&&q.get('in')>=today){S.in=q.get('in');S.out=addD(S.in,Math.max(1,Math.min(60,+q.get('n')||1)))}
 const b=S.in?new Date(S.in+'T00:00:00Z'):new Date();S.view={y:b.getUTCFullYear(),m:b.getUTCMonth()};
 await load();text(lang());fetchRates(()=>text(lang()));
})();
</script>
</body>
</html>
