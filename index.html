<html lang="es">
<head>

<link rel="icon" href="img/logo.png">
<style>
:root{--red:#D9483B;--navy:#1F3468;--yel:#EDE56A;--grn:#5B8F3A;--maroon:#7B2D33;--cream:#F5F3EE;--ink:#222;--mute:#666;
--serif:Georgia,'Times New Roman',serif;--sans:system-ui,-apple-system,'Segoe UI',Roboto,sans-serif;
box-sizing:border-box;padding-top:env(safe-area-inset-top,0px)}
*,*::before,*::after{box-sizing:inherit}
html{scroll-behavior:smooth;scroll-padding-top:70px}
body{margin:0;font:16px/1.6 var(--sans);color:var(--ink);background:#fff}
a{color:var(--navy)}
:focus-visible{outline:3px solid var(--navy);outline-offset:2px}
.wrap{max-width:1000px;margin:0 auto;padding:0 20px}
.band{height:12px;background:linear-gradient(90deg,var(--red) 0 25%,var(--navy) 25% 50%,var(--yel) 50% 75%,var(--grn) 75%)}
header{position:sticky;top:0;z-index:5;background:#fff;border-bottom:1px solid #e6e2d8}
header .wrap{display:flex;align-items:center;gap:16px;min-height:56px;flex-wrap:wrap}
header img{height:40px;width:auto}
nav{display:flex;gap:18px;margin-left:auto}
nav a{text-decoration:none;color:var(--navy);font-weight:600;font-size:.95rem}
select{font:inherit;padding:6px 8px;border:1px solid #bbb;border-radius:6px;background:#fff}
.hero{text-align:center;padding:48px 0 40px}
.hero img{width:min(420px,80%);height:auto}
.hero p{font:1.25rem/1.4 var(--serif);color:var(--navy);max-width:34ch;margin:20px auto 18px}
.badge{display:inline-block;border:2px solid var(--maroon);color:var(--maroon);border-radius:99px;padding:6px 18px;font-weight:700}
section{padding:48px 0}
h2{font:700 2rem/1.2 var(--serif);color:var(--navy);margin:0 0 24px}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(210px,1fr));gap:16px}
.room{border-radius:10px;overflow:hidden;background:var(--cream);display:flex;flex-direction:column}
.ph{position:relative;aspect-ratio:4/3;display:grid;place-items:center;font:700 3.2rem var(--serif);color:rgba(255,255,255,.9)}
.ph img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover}
.room div.b{padding:12px 14px 14px}
.room h3{margin:0;font:700 1.15rem var(--serif);color:var(--navy)}
.room small{display:block;color:var(--mute)}
.room .pr{margin-top:6px;font-weight:700;color:var(--maroon)}
.rows{display:grid;gap:10px}
.row{display:grid;grid-template-columns:10px 1fr auto auto;align-items:stretch;background:var(--cream);border-radius:10px;overflow:hidden}
.row .t{padding:12px 16px}
.row b{font:700 1.1rem var(--serif);color:var(--navy);display:block}
.row small{color:var(--mute)}
.row .bs,.row .us{display:grid;place-items:center;color:#fff;font:700 1.15rem ui-monospace,Menlo,monospace;padding:0 16px;min-width:84px}
.bs{background:var(--maroon)}.us{background:var(--navy)}
.note{color:var(--mute);font-size:.9rem;margin-top:14px}
.incl{background:var(--cream);border-radius:10px;padding:20px 24px;margin-top:22px}
.incl h3{margin:0 0 8px;font:700 1.1rem var(--serif);color:var(--grn)}
.incl ul{margin:0;padding-left:20px;columns:2;column-gap:32px}
form{display:grid;grid-template-columns:1fr 1fr;gap:12px;background:var(--cream);padding:22px;border-radius:10px}
label{display:grid;gap:4px;font-weight:600;font-size:.9rem}
input,textarea,select.f{font:inherit;padding:10px;border:1px solid #bbb;border-radius:6px;width:100%}
.full{grid-column:1/-1}
.btns{display:flex;flex-wrap:wrap;gap:12px;align-items:center}
button,.btn{font:700 1rem var(--sans);border:0;border-radius:8px;padding:12px 22px;cursor:pointer;text-decoration:none;display:inline-block}
.go{background:var(--maroon);color:#fff}.wa{background:#1f8f4a;color:#fff}
.ota{margin-top:18px;display:flex;gap:10px;flex-wrap:wrap;align-items:center}
.ota a{border:1px solid var(--navy);border-radius:99px;padding:5px 14px;text-decoration:none;font-weight:600}
#ok{font-weight:600;color:var(--grn)}
.info{display:grid;grid-template-columns:repeat(auto-fit,minmax(220px,1fr));gap:16px}
.info p{margin:0;padding-left:14px;border-left:6px solid var(--red)}
.info p:nth-child(2){border-color:var(--navy)}.info p:nth-child(3){border-color:var(--yel)}.info p:nth-child(4){border-color:var(--grn)}
footer{background:var(--navy);color:#fff;padding:28px 0;text-align:center}
footer a{color:var(--yel)}
@media(max-width:640px){nav{display:none}.incl ul{columns:1}form{grid-template-columns:1fr}.row{grid-template-columns:10px 1fr auto}.row .us{display:none}.ph{font-size:2.4rem}}
@media(prefers-reduced-motion:reduce){html{scroll-behavior:auto}}
</style>

</main>

const T={};L.forEach(l=>T[l]={});
RAW.split('\n').forEach(r=>{const p=r.split('|');L.forEach((l,i)=>T[l][p[0]]=p[i+1])});

// [número, tipo, camas, precio Bs, unidad, nota]
const ROOMS=[['1','priv',4,'','',''],['2','dorm',6,'70','perBed','sold'],['3','dorm',4,'70','perBed','sold'],['4','dormx',12,'70','perBed','sold'],
['5','dbl',2,'150','perRoom',''],['5.5','fam',5,'400','perRoom','whole'],['6','sgl',1,'90','perRoom',''],['7','dbl',2,'90–150','perRoom',''],['8','dorm',4,'70','perBed','sold']];
const PRICES=[['p1',70,7,'perBed','--red'],['p2',100,9,'perBed','--navy'],['p3',150,14,'perRoom','--yel'],['p4',200,18,'perRoom','--grn'],['p5',260,23,'perRoom','--red'],['p6',260,23,'perRoom','--navy']];
const COL=['--red','--navy','--grn','--maroon'];
const $=s=>document.querySelector(s);

function render(l){
 const t=T[l];document.documentElement.lang=l;
 document.querySelectorAll('[data-t]').forEach(e=>e.textContent=t[e.dataset.t]);
 $('#roomGrid').innerHTML=ROOMS.map((r,i)=>`<article class="room"><div class="ph" style="background:var(${COL[i%4]})">${r[0]}<img src="img/room-${r[0].replace('.','_')}.jpg" alt="" loading="lazy" onerror="this.remove()"></div><div class="b"><h3>${t.room} ${r[0]}</h3><small>${t[r[1]]} · ${r[2]} ${t.beds}</small>${r[5]?`<small>${t[r[5]]}</small>`:''}${r[3]?`<div class="pr">Bs ${r[3]} <small style="display:inline">${t[r[4]]}</small></div>`:''}</div></article>`).join('');
 $('#rows').innerHTML=PRICES.map(p=>`<div class="row"><span style="background:var(${p[4]})"></span><div class="t"><b>${t[p[0]]}</b><small>${t[p[3]]}</small></div><div class="bs">Bs ${p[1]}</div><div class="us">$ ${p[2]}</div></div>`).join('');
 $('#incl').innerHTML=t.incl.split(';').map(x=>`<li>${x}</li>`).join('');
 const sel=$('#roomSel'),cur=sel.value;
 sel.innerHTML=['p1','p2','p3','p4','p5','p6'].map(k=>`<option value="${t[k]}">${t[k]}</option>`).join('');
 if(cur)sel.selectedIndex=Math.max(0,sel.selectedIndex);
 $('#ok').textContent='';
}
const sel=$('#lang');
let saved=null;try{saved=localStorage.getItem('lang')}catch(e){}
const nav=(navigator.language||'es').slice(0,2);
let start=L.includes(saved)?saved:(L.includes(nav)?nav:'es');
sel.value=start;render(start);
sel.onchange=()=>{try{localStorage.setItem('lang',sel.value)}catch(e){};render(sel.value)};

$('#wa').onclick=()=>{
 const f=new FormData($('#f'));
 const msg=`Hola Oruro Backpackers! ${f.get('name')||''}\n${T[sel.value].in}: ${f.get('checkin')||'-'}\n${T[sel.value].out}: ${f.get('checkout')||'-'}\n${T[sel.value].guests}: ${f.get('guests')}\n${f.get('room')}\n${f.get('message')||''}`;
 window.open(`https://wa.me/${WA}?text=${encodeURIComponent(msg)}`,'_blank');
};
$('#f').onsubmit=async e=>{
 e.preventDefault();const t=T[sel.value];
 try{const r=await fetch('send.php',{method:'POST',body:new FormData(e.target)});
  if(!r.ok)throw 0;$('#ok').textContent=t.sentOk;e.target.reset();
 }catch(x){$('#ok').textContent=t.sentErr}
};
</script>
